<section class="page-card">
  <p class="eyebrow">Angular showcase</p>
  <h1>{{ title | formatTitle }}</h1>
  <p class="intro">This page demonstrates a custom pipe, clean navigation, and a more polished layout.</p>

  <div class="feature-list">
    @for (item of highlights; track item) {
      <span class="feature-pill">{{ item }}</span>
    }
  </div>

  <a class="action-link" routerLink="/about-us">Learn more about us</a>
</section>
